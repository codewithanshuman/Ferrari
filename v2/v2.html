<script>
  'use strict';
  const scene = document.querySelector('.scene');
  const artboard = document.getElementById('artboard');
  function fitArtboard() {
    const scale = Math.min(window.innerWidth / 941, window.innerHeight / 1672);
    artboard.style.setProperty('--scale', String(scale));
  }
  fitArtboard();
  window.addEventListener('resize', fitArtboard, {passive:true});
  // No buttons or input: exactly two seconds OFF, then two seconds ON.
  let lightsOn = false;
  window.setInterval(() => {
    lightsOn = !lightsOn;
    scene.classList.toggle('lights-on', lightsOn);
  }, 2000);
