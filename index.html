<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Ferrari — Choose Your Version</title>
<style>
:root { color-scheme:dark; font-family:Arial,Helvetica,sans-serif; }
*,*::before,*::after { box-sizing:border-box; }
html { min-height:100%; background:#000; }
body { min-height:100svh; margin:0; background:#000; color:#fff; display:grid; place-items:center; padding:24px 18px 35px; }
.page { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
/* Every geometric trace is a real CSS polygon. This page loads zero images,
   background assets, external fonts, SVGs, canvas bitmaps or image data. */
.ferrari-art { display:block; width:min(450px,86vw,calc((100svh - 174px)*.9344)); max-width:100%; aspect-ratio:1040/1113; flex-shrink:0; position:relative; user-select:none; pointer-events:none; }
.trace {position:absolute;display:block;margin:0;padding:0;border:0;}
.trace.ink {background:#1b1918;}
/* Only the Ferrari wordmark changes to white; the shield stays untouched. */
.trace.ink.wordmark {background:#fff;}
.trace.green {background:#009034;}
.trace.white {background:#fff;}
.trace.red {background:#e40016;}
.trace.yellow {background:#ffec00;}
.trace.black {background:#000;}
.choices {display:flex; justify-content:center; align-items:center; gap:clamp(13px,4vw,44px); margin-top:52px; width:100%;}
/* Two compact car BUTTONS, not oversized cards. No tooltip above either car. */
.car-btn {position:relative;isolation:isolate;display:block;flex:0 0 174px;width:174px;height:74px;padding:0;border:0;background:transparent;color:#fff;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;outline-offset:5px;filter:drop-shadow(0 7px 9px #000b);transition:transform .3s cubic-bezier(.2,.8,.2,1),filter .3s;}
.car-btn:focus-visible {outline:2px solid #ff454b;border-radius:18px;}
.car-btn:hover {transform:translateY(-4px) translateX(3px);filter:drop-shadow(0 10px 13px #e8193488);}
.car-btn:active {transform:translateY(0) scale(.96);}
.ground {position:absolute;left:12px;right:11px;bottom:5px;height:5px;background:#ed233a;filter:blur(8px);opacity:.25;transition:opacity .25s,transform .25s;}
.car-btn:hover .ground,.car-btn:focus-visible .ground {opacity:.9;transform:scaleX(1.08);}
.roof {position:absolute;left:43px;top:7px;width:93px;height:33px;clip-path:polygon(19% 100%,33% 15%,48% 1%,76% 6%,100% 100%);background:linear-gradient(165deg,#fa4b54 0%,#ba0923 56%,#5b0613 100%);}
.window {position:absolute;left:60px;top:13px;width:64px;height:21px;clip-path:polygon(0 100%,22% 5%,71% 5%,100% 100%);background:linear-gradient(130deg,#313c49 0%,#0b1019 48%,#07080c 100%);border-top:1px solid #fd9ba0;}
.window::after {content:"";position:absolute;left:32px;top:0;width:3px;height:26px;background:#860d1f;transform:rotate(-20deg);}
.car-body {position:absolute;left:5px;top:31px;width:164px;height:29px;clip-path:polygon(0 36%,12% 16%,30% 5%,70% 4%,88% 15%,100% 45%,99% 88%,87% 100%,13% 100%,1% 81%);background:linear-gradient(180deg,#ff505b 0%,#e01632 27%,#ac0a24 52%,#480510 88%,#220509 100%);}
.car-body::before {content:"";position:absolute;left:3px;right:3px;top:11px;height:1px;background:#ff6a74a0;}
.car-body::after {content:"";position:absolute;left:22px;right:17px;bottom:2px;height:3px;border-radius:4px;background:#090a0d;}
.doorline {position:absolute;left:102px;top:33px;height:23px;border-left:1px solid #5d0617;transform:skewX(-9deg);}
/* Version label exists ONLY on the car; no floating label or upper text. */
.badge {position:absolute;top:37px;left:72px;font-size:13px;line-height:17px;font-weight:950;font-style:italic;letter-spacing:-.5px;text-shadow:0 1px 3px #26030c;transition:transform .28s,text-shadow .28s;}
.car-btn:hover .badge,.car-btn:focus-visible .badge {transform:translateX(2px) scale(1.16);text-shadow:0 0 8px #fff9,0 0 15px #f33;}
.headlight {position:absolute;right:5px;top:39px;width:12px;height:6px;clip-path:polygon(20% 0,100% 38%,100% 100%,0 100%);background:#fff7df;box-shadow:0 0 7px #fff,0 0 15px #ff5757;transition:filter .25s;}
.car-btn:hover .headlight,.car-btn:focus-visible .headlight {filter:drop-shadow(0 0 7px #fff);}
.taillight {position:absolute;left:5px;top:41px;width:7px;height:5px;border-radius:2px;background:#ff6973;box-shadow:0 0 5px #e21b36;}
.wheel {position:absolute;top:48px;width:23px;height:23px;border:5px solid #111319;border-radius:50%;background:radial-gradient(circle,#f3f4f6 0 20%,#5e6873 23% 46%,#171b20 48%);box-shadow:0 0 0 1px #454951,inset 0 0 0 1px #e8ebef;z-index:2;}
.wheel.rear {left:28px;} .wheel.front {right:23px;}
.car-btn:hover .wheel,.car-btn:focus-visible .wheel {animation:roll .45s linear infinite;}
@keyframes roll {to {rotate:360deg;}}
.speed {position:absolute;left:-13px;top:39px;width:18px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff344a);opacity:0;transform:translateX(9px);}
.speed.two {top:47px;left:-18px;width:14px;}
.car-btn:hover .speed,.car-btn:focus-visible .speed {opacity:1;animation:streak .55s ease-in-out infinite alternate;}
.car-btn:hover .speed.two,.car-btn:focus-visible .speed.two {animation-delay:.12s;}
@keyframes streak {to {transform:translateX(-2px);opacity:.2;}}
@media (max-width:380px) {.choices {transform:scale(.82);width:122%;margin-top:7px;}}
@media (prefers-reduced-motion:reduce) {*,*::before,*::after {animation:none!important;transition:none!important;}}
</style>
</head>
